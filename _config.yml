# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: Gayathri Rajamohan
first_name: Gayathri
last_name: Rajamohan
description: >
  Cybersecurity Educator | Threat Hunter | Security Enthusiast
baseurl: ""
url: https://defendwithgr.github.io

# -----------------------------------------------------------------------------
# Theme Configuration
# -----------------------------------------------------------------------------

remote_theme: b2a3e8/jekyll-theme-console  # Used by GitHub Pages
# For local builds when network/SSL is unavailable, comment remote_theme and uncomment:
# theme: jekyll-theme-console
style: light  # default to light mode
listen_for_clients_preferred_style: true  # Auto-switch based on system preference

# -----------------------------------------------------------------------------
# Navigation
# -----------------------------------------------------------------------------

header_pages:
  - index.md
  - whoami.md
  - projects.md
  - blog.md
  - awards.md
  - resume.md

# -----------------------------------------------------------------------------
# Footer
# -----------------------------------------------------------------------------

footer: >
  © 2026 Gayathri Rajamohan | 
  <a href="https://www.linkedin.com/in/gayathri-rajamohan/">LinkedIn</a> | 
  <a href="https://github.com/defendwithgr">GitHub</a>

# -----------------------------------------------------------------------------
# Build settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - bin/
  - vendor/
  - COMPLETE_PORTFOLIO_GUIDE.md
  - COMPLETE_PORTFOLIO_GUIDE.pdf
  - CLAUDE.md

# -----------------------------------------------------------------------------
# Collections (for projects and blog posts)
# -----------------------------------------------------------------------------

collections:
  projects:
    output: true
    permalink: /projects/:name/

# -----------------------------------------------------------------------------
# Custom Styling
# -----------------------------------------------------------------------------

# Load custom CSS for terminal glow effects
sass:
  sass_dir: _sass
  style: compressed

# Add custom CSS
custom_css:
  - /assets/css/custom.css
